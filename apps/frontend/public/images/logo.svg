<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente en el tono naranja solicitado -->
    <linearGradient id="orangeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D93D00"/>
      <stop offset="100%" stop-color="#FF5714"/>
    </linearGradient>

    <!-- Sombra elegante para dar relieve -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#802000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fondo transparente (se ha eliminado cualquier rectángulo o color de fondo) -->

  <!-- Grupo principal del logo -->
  <g transform="translate(45, 45) scale(0.82)" filter="url(#dropShadow)">
    <!-- Asa y parte trasera del carrito -->
    <path d="M 80 140 C 65 140, 52 132, 45 118 C 38 104, 40 88, 52 78 C 64 68, 80 72, 88 85" 
          fill="none" stroke="url(#orangeGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cuerpo de la cesta -->
    <path d="M 75 120 L 110 270 C 114 286, 128 298, 145 298 L 345 298 C 362 298, 376 286, 380 270 L 415 150" 
          fill="none" stroke="url(#orangeGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Línea de crecimiento / tendencia que cruza el carrito -->
    <path d="M 90 285 L 180 200 L 250 240 L 375 115" 
          fill="none" stroke="url(#orangeGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Punta de flecha hacia arriba -->
    <g transform="translate(375, 115)">
      <path d="M -45 25 L 0 0 L -25 45" 
            fill="none" stroke="url(#orangeGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Ruedas del carrito -->
    <circle cx="160" cy="355" r="18" fill="url(#orangeGrad)"/>
    <circle cx="310" cy="355" r="18" fill="url(#orangeGrad)"/>
    
    <!-- Brillos interiores de las ruedas -->
    <circle cx="160" cy="355" r="6" fill="#ffffff" opacity="0.4"/>
    <circle cx="310" cy="355" r="6" fill="#ffffff" opacity="0.4"/>
  </g>
</svg>
